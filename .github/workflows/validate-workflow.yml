name: Validate Workflow

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: validate-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate YAML syntax
        run: |
          echo "Validating workflow files..."
          for f in .github/workflows/*.{yml,yaml}; do
            [[ -e "$f" ]] || continue
            echo "Checking $f"
            python3 -c "import yaml, sys; yaml.safe_load(open('$f'))" || { echo "Invalid YAML: $f"; exit 1; }
          done
          echo "All workflow files are valid YAML"

      - name: Lint workflow files with actionlint
        uses: rhysd/actionlint@v1.7.12
