name: Validate Workflow

on:
  push:
    branches: [main, personal-main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main, personal-main]
    paths:
      - ".github/workflows/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          echo "Validating workflow files..."
          for f in .github/workflows/*.{yml,yaml}; do
            [[ -e "$f" ]] || continue
            echo "Checking $f"
            python3 -c "import yaml, sys; yaml.safe_load(open('$f'))" || { echo "Invalid YAML: $f"; exit 1; }
          done
          echo "All workflow files are valid YAML"

      - name: Lint with actionlint CLI
        run: |
          # ติดตั้ง actionlint ถ้ายัง
          curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/install-actionlint.bash | bash -s
          ./actionlint .github/workflows/*.yml
