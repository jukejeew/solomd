name: Release SoloMD PE

# Trigger: push a tag like `v4.11.21-pe.1`, e.g.
#   git tag v4.11.21-pe.1 && git push origin v4.11.21-pe.1
# Tags live on personal-main (`main` is a read-only upstream mirror).
# This kicks off a matrix build across Linux + Windows portable and uploads
# the bundles to a draft GitHub Release named after the tag. The release
# stays a draft so you can review the artifacts before flipping the
# "Publish" switch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # also allows manual triggering from the Actions tab

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 portable only (PE: MSI installer disabled for now —
          # uncomment the `args: "--bundles msi"` line to restore it).
          # `--bundles none` still compiles SoloMD-PE.exe; the portable .zip
          # step below picks it up from target/release.
          - platform: windows-latest
            args: "--bundles none"
            rust_targets: ""
          # PE disabled: Windows ARM64 MSI (Snapdragon X / Copilot+ PCs).
          # Uncomment to restore.
          # - platform: windows-11-arm
          #   args: "--bundles msi"
          #   rust_targets: ""
          # Linux x64 (.deb / .AppImage / .rpm)
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb,rpm"
            rust_targets: ""
          # Linux ARM64 — for Raspberry Pi 4/5, Mac users running Linux VMs,
          # Ampere servers, and ARM Chromebooks.
          # Cross-compiled from x86_64 runner via aarch64 toolchain.
          - platform: ubuntu-22.04-arm
            args: "--bundles appimage,deb,rpm"
            rust_targets: ""
          # NOTE: macOS removed from CI matrix.
          # Build locally with `./scripts/build-mac.sh` (full sign + notarize)
          # then upload the resulting .dmg manually to the GitHub release.
          # Reason: notarytool can hang indefinitely on GitHub-hosted runners
          # without producing a clear error, burning hours of CI time.

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            xdg-utils \
            file \
            fuse \
            libfuse2

      - name: Install frontend dependencies
        run: cd app && pnpm install --frozen-lockfile

      # Tauri's build.rs verifies externalBin presence at COMPILE time
      # (not at bundle time), so the sidecar must exist before tauri-action
      # runs cargo build. beforeBundleCommand can't help here — it runs
      # after the rust build. Pre-build the sidecar for this matrix's
      # rust triple, matching what tauri-action's TAURI_ENV_TARGET_TRIPLE
      # will be.
      - name: Pre-build solomd-mcp sidecar
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          echo "host triple: $TRIPLE"
          bash scripts/build-mcp-sidecar.sh "$TRIPLE"

      - name: Build & release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing/notarization secrets are no longer wired here —
          # the macOS build is done locally on the maintainer's machine via
          # scripts/build-mac.sh. See scripts/README.md.
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "SoloMD PE ${{ github.ref_name }}"
          releaseBody: |
            ## SoloMD PE ${{ github.ref_name }}

            > Personal Edition — replaces upstream SoloMD on this machine.
            > Base: upstream `v4.11.21` + PE patches (Obsidian-faithful wikilinks,
            > menu-bar toggle, multi-platform exit).

            ### Install / 安装

            - **Linux**: download `.AppImage` (`chmod +x` and run) or `.deb` / `.rpm`
            - **Windows**: download `*_x64-portable.zip`, unzip and run `SoloMD-PE.exe` (no install; Win10 1809+ needs WebView2 — preinstalled on most machines, otherwise https://go.microsoft.com/fwlink/p/?LinkId=2124703)
            - If upstream `solomd` is installed, uninstall it first (`apt remove solomd` / delete the old portable) to avoid two apps fighting over `.md` associations
            - Settings migrate once: copy `%APPDATA%\app.solomd` → `%APPDATA%\app.solomd-pe` (Windows) or `~/.config/app.solomd` → `~/.config/app.solomd-pe` (Linux)

            ### Verify / 校验

            The Windows build is not code-signed, so Chrome's Enhanced
            Protection scans each new release and reports "No viruses detected"
            — that is a pass, not a warning. `SHA256SUMS.txt` is attached below
            if you want to verify the download yourself.

            🤖 Auto-built by GitHub Actions (PE)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # ----------------------------------------------------------------------
      # PE replace-mode: make `solomd-pe` replace upstream `solomd` on apt.
      # Tauri's bundler can't emit Conflicts/Replaces itself, so repack the
      # .deb after tauri-action uploaded it and re-upload with --clobber.
      # (RPM Obsoletes stays a docs-only step for pe.1 — see releaseBody.)
      # ----------------------------------------------------------------------
      - name: Repack .deb with PE Conflicts (Linux)
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for deb in app/src-tauri/target/release/bundle/deb/*.deb; do
            echo "repacking $deb"
            TMP="$(mktemp -d)"
            dpkg-deb -R "$deb" "$TMP"
            {
              echo "Conflicts: solomd"
              echo "Replaces: solomd"
              echo "Provides: solomd"
            } >> "$TMP/DEBIAN/control"
            dpkg-deb -b "$TMP" "$deb"
            rm -rf "$TMP"
            gh release upload "${{ github.ref_name }}" "$deb" --clobber
          done

      # ----------------------------------------------------------------------
      # Defender gate — PE DISABLED (no MSI in the matrix; portable only).
      # Re-enable when the MSI job returns: restore the `if:` below.
      # ----------------------------------------------------------------------
      - name: Scan Windows bundles with Defender
        if: false # PE: MSI disabled — portable only
        shell: pwsh
        run: |
          $plat = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform" -Directory -ErrorAction SilentlyContinue |
                  Sort-Object Name -Descending | Select-Object -First 1
          $mp = if ($plat) { Join-Path $plat.FullName 'MpCmdRun.exe' }
                else { Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe' }
          if (-Not (Test-Path $mp)) {
            Write-Warning "MpCmdRun.exe not found on this runner — skipping the Defender gate"
            exit 0
          }
          # Stale signatures would test a model nobody is actually running.
          # Non-fatal: a failed update still leaves the shipped definitions.
          try { & $mp -SignatureUpdate | Out-Null } catch { Write-Warning "signature update failed: $_" }
          Write-Host ("engine   : " + (Get-MpComputerStatus).AMProductVersion)
          Write-Host ("signature: " + (Get-MpComputerStatus).AntivirusSignatureVersion)

          # PE: paths use the SoloMD-PE binary name. Re-enable with the `if:`
          # above when the MSI job returns.
          $targets = @()
          $targets += Get-ChildItem "app/src-tauri/target/release/bundle/msi" -Filter *.msi -ErrorAction SilentlyContinue
          $targets += Get-ChildItem "app/src-tauri/target/release/SoloMD-PE.exe" -ErrorAction SilentlyContinue
          $targets += Get-ChildItem "mcp-server/target" -Recurse -Filter "solomd-mcp.exe" -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match "\\release\\" } | Select-Object -First 1
          if (-Not $targets) {
            Write-Error "Nothing to scan — the bundle layout moved and this gate is now blind"
            exit 1
          }

          $hits = @()
          foreach ($t in $targets) {
            $out = (& $mp -Scan -ScanType 3 -File $t.FullName -DisableRemediation 2>&1 | Out-String)
            if ($out -match 'found no threats') {
              Write-Host "clean  $($t.Name)"
            } else {
              $threat = (($out -split "`n") | Where-Object { $_ -match 'Threat\s+:' }) -join ' '
              Write-Host "FLAG   $($t.Name)  $threat"
              $hits += "$($t.Name) -> $threat"
            }
          }

          if ($hits) {
            Write-Host "::error::Defender flagged $($hits.Count) artifact(s): $($hits -join '; ')"
            Write-Host "The release stays a draft. Rebuilding often shifts enough bytes to clear an !ml verdict;"
            Write-Host "either way report it at https://www.microsoft.com/en-us/wdsi/filesubmission (Software developer)."
            exit 1
          }
          Write-Host "Defender gate passed."

      # ----------------------------------------------------------------------
      # PE DISABLED: solomd-mcp standalone tarballs (Personal Edition ships
      # the sidecar embedded only — no separate download). Uncomment to
      # restore standalone `solomd-mcp-*` assets + install-mcp.sh support.
      # ----------------------------------------------------------------------
      - name: Pack solomd-mcp tarball (Linux)
        if: false # PE: standalone mcp disabled
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Map runner -> arch label install-mcp.sh expects.
          case "${{ matrix.platform }}" in
            ubuntu-22.04-arm) ARCH="arm64" ;;
            ubuntu-22.04)     ARCH="x64" ;;
            *) echo "unknown linux runner: ${{ matrix.platform }}"; exit 1 ;;
          esac
          ASSET="solomd-mcp-linux-${ARCH}.tar.gz"
          # Tauri's externalBin produced the binary under
          # mcp-server/target/<triple>/release/solomd-mcp via our pre-bundle
          # script. Find it portably without hardcoding the triple.
          BIN="$(find mcp-server/target -type f -name solomd-mcp -path '*/release/*' | head -1)"
          if [[ -z "$BIN" || ! -x "$BIN" ]]; then
            echo "Missing solomd-mcp release binary — beforeBundleCommand didn't run"
            ls -la mcp-server/target || true
            exit 1
          fi
          STAGE="$(mktemp -d)"
          cp "$BIN" "$STAGE/solomd-mcp"
          chmod +x "$STAGE/solomd-mcp"
          tar -C "$STAGE" -czf "$ASSET" solomd-mcp
          gh release upload "${{ github.ref_name }}" "$ASSET" --clobber

      # ----------------------------------------------------------------------
      # Windows portable .zip — PE: x64 only (windows-11-arm disabled).
      # Same SoloMD-PE.exe Tauri produces, zipped without an installer.
      # (PE: standalone solomd-mcp .zip disabled — sidecar stays embedded.)
      # ----------------------------------------------------------------------
      - name: Build Windows portable .zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PE: x64 only.
          $arch = "x64"
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $exe = "app/src-tauri/target/release/SoloMD-PE.exe"
          if (-Not (Test-Path $exe)) {
            Write-Error "Missing $exe — Tauri build did not run as expected"
            exit 1
          }
          # Locate the solomd-mcp.exe Tauri's externalBin built before the bundle.
          $mcpExe = Get-ChildItem -Path "mcp-server/target" -Recurse -Filter "solomd-mcp.exe" |
                    Where-Object { $_.FullName -match "\\release\\" } |
                    Select-Object -First 1
          $stage = "SoloMD-PE_${version}_${arch}-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe -Destination "$stage/SoloMD-PE.exe"
          if ($mcpExe) { Copy-Item $mcpExe.FullName -Destination "$stage/solomd-mcp.exe" }
          # Tiny README the user finds inside the zip.
          @"
          SoloMD PE ${version} — portable build (${arch})

          Just run SoloMD-PE.exe. No installation required.
          Settings + recents are stored in %APPDATA%\app.solomd-pe as usual.
          (Migrating from upstream? Copy %APPDATA%\app.solomd here once.)

          Requires Microsoft Edge WebView2 (preinstalled on Windows 10/11).
          If launch fails with a WebView2 missing error, install from
          https://go.microsoft.com/fwlink/p/?LinkId=2124703
          "@ | Set-Content -Path "$stage/README.txt" -Encoding UTF8
          $zip = "SoloMD-PE_${version}_${arch}-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          gh release upload "${{ github.ref_name }}" $zip --clobber

      # ----------------------------------------------------------------------
      # PE DISABLED: install-mcp.sh self-test (no standalone tarball).
      # Re-enable together with "Pack solomd-mcp tarball" above.
      # ----------------------------------------------------------------------
      - name: Verify install-mcp.sh self-test
        if: false # PE: standalone mcp disabled
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            ubuntu-22.04-arm) ARCH="arm64" ;;
            ubuntu-22.04)     ARCH="x64" ;;
          esac
          ASSET="solomd-mcp-linux-${ARCH}.tar.gz"
          export LOCAL_TARBALL="$PWD/$ASSET"
          if [[ ! -f "$LOCAL_TARBALL" ]]; then
            echo "tarball missing at $LOCAL_TARBALL"; ls -la; exit 1
          fi
          export VERSION="${{ github.ref_name }}"
          export INSTALL_DIR="$RUNNER_TEMP/mcp-self-test/bin"
          bash scripts/install-mcp.sh
          "$INSTALL_DIR/solomd-mcp" --version
          echo "self-test ok"

  # ---------------------------------------------------------------------------
  # PE DISABLED: web-clipper (Personal Edition ships no browser extension).
  # Uncomment the whole job to restore clipper zips on the release.
  # ---------------------------------------------------------------------------
  web-clipper:
    if: false # PE: web-clipper disabled
    # Wait for the draft release to exist (one of the publish jobs creates it
    # via tauri-action's `release: true`). Without `needs:`, we race against
    # the matrix and fail with `release not found` when we land first.
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install web-clipper deps
        working-directory: web-clipper
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: web-clipper
        run: pnpm typecheck

      - name: Build Chrome + Firefox bundles
        working-directory: web-clipper
        run: pnpm build

      - name: Rename for release
        working-directory: web-clipper/dist
        run: |
          cp chrome.zip solomd-clipper-chrome.zip
          cp firefox.zip solomd-clipper-firefox.zip
          cp source.zip solomd-clipper-source.zip

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            web-clipper/dist/solomd-clipper-chrome.zip \
            web-clipper/dist/solomd-clipper-firefox.zip \
            web-clipper/dist/solomd-clipper-source.zip \
            --clobber

  # ---------------------------------------------------------------------------
  # SHA256SUMS.txt over every asset on the draft release.
  #
  # The Windows builds are unsigned, so Chrome and SmartScreen treat each new
  # version as an unknown binary with zero download reputation. A published
  # checksum manifest at least lets users verify what they downloaded until a
  # code-signing certificate is in place.
  #
  # Runs last so it covers the desktop matrix and the web-clipper zips. The
  # macOS .dmg and the Android .apk are uploaded by hand afterwards — re-run
  # `./scripts/checksums.sh <tag>` locally once those land to refresh the
  # manifest.
  # ---------------------------------------------------------------------------
  checksums:
    needs: [publish] # PE: web-clipper disabled, so checksums waits on publish only
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/checksums.sh "${{ github.ref_name }}"
