name: Release SoloMD PE

# Trigger: push a tag like `v4.11.21-pe.1`, e.g.
#   git tag v4.11.21-pe.1 && git push origin v4.11.21-pe.1
# Tags are cut from `main` (`mirror` is a read-only upstream copy).
# This kicks off a matrix build across Linux + Windows portable and uploads
# the bundles to a draft GitHub Release named after the tag. The release
# stays a draft so you can review the artifacts before flipping the
# "Publish" switch.
on:
  push:
    tags:
      - "v*"
  # NOTE: no workflow_dispatch on purpose — dispatching on a branch mints a
  # release named after the branch (happened twice: "main", "personal-main").
  # To re-run a failed tag build use `gh run rerun --failed`, or delete the
  # tag + draft and push the tag again.

jobs:
  # Single-upload flow (root fix for duplicate assets): tauri-action only
  # BUILDS — it never uploads, so Tauri-native filenames (with a space from
  # productName "SoloMD PE", which GitHub normalizes to dots and our old
  # delete step could never match) never reach the release. Each matrix job
  # uploads only its canonical SoloMD-PE_* files via `gh release upload`.
  # This job creates the draft release once so the matrix jobs share it.
  setup:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "draft $TAG already exists, reusing"
          else
            gh release create "$TAG" --draft --title "SoloMD PE $TAG" --notes-file - <<'EOF'
          ## SoloMD PE ${{ github.ref_name }}

          > Personal Edition — a personal fork that replaces upstream SoloMD on this machine.
          > Base: upstream `v4.11.21`, plus PE-only changes (separate app identity `app.solomd.pe`,
          > no upstream auto-update, one-time settings migration).

          ### Install

          - **Linux**: download the `.deb` (Debian/Ubuntu) or `.rpm` (Fedora/RHEL) for your architecture (x64 / arm64). The package removes upstream `solo-md` automatically if present.
          - **Windows**: download `*_x64-portable.zip`, unzip, and run `SoloMD-PE.exe`. No installation needed. If you still keep the old upstream portable around, delete its folder manually so the two copies don't fight over `.md` file associations.
          - Windows needs Microsoft Edge WebView2 (preinstalled on Windows 10/11, otherwise https://go.microsoft.com/fwlink/p/?LinkId=2124703).
          - **Settings**: your upstream settings, tabs, and workspace migrate automatically on first launch. Nothing is deleted, and a backup is kept next to the new profile.

          ### Verify

          - Check the `SHA256SUMS.txt` manifest below to verify your download.
          - The Windows build is not code-signed, so Chrome's Enhanced Protection may flag the first download ("No viruses detected" is a pass, not a warning).

          🤖 Auto-built by GitHub Actions (PE)
          EOF
          fi

  publish:
    needs: [setup]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 portable only (PE: MSI installer disabled for now —
          # uncomment the `args: "--bundles msi"` line to restore it).
          # `--no-bundle` still compiles SoloMD-PE.exe (plus frontend);
          # the portable .zip step below picks it up from target/release.
          - platform: windows-latest
            args: "--no-bundle"
            rust_targets: ""
          # PE disabled: Windows ARM64 MSI (Snapdragon X / Copilot+ PCs).
          # Uncomment to restore.
          # - platform: windows-11-arm
          #   args: "--bundles msi"
          #   rust_targets: ""
          # Linux x64 (.deb / .rpm — PE: no AppImage, no MSI)
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm"
            rust_targets: ""
          # Linux ARM64 — for Raspberry Pi 4/5, Mac users running Linux VMs,
          # Ampere servers, and ARM Chromebooks.
          # Cross-compiled from x86_64 runner via aarch64 toolchain.
          - platform: ubuntu-22.04-arm
            args: "--bundles deb,rpm"
            rust_targets: ""
          # NOTE: macOS removed from CI matrix.
          # Build locally with `./scripts/build-mac.sh` (full sign + notarize)
          # then upload the resulting .dmg manually to the GitHub release.
          # Reason: notarytool can hang indefinitely on GitHub-hosted runners
          # without producing a clear error, burning hours of CI time.

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-js

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        uses: ./.github/actions/setup-linux-deps

      - uses: ./.github/actions/build-sidecar

      - name: Build with tauri-action (build only, no upload)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing/notarization secrets are no longer wired here —
          # the macOS build is done locally on the maintainer's machine via
          # scripts/build-mac.sh. See scripts/README.md.
        with:
          projectPath: app
          args: ${{ matrix.args }}
          # PE: build only — omitting tagName/releaseName/releaseId makes
          # the action skip all uploads (its own documented behavior), so
          # the steps below are the single upload path. The Windows job
          # runs `--no-bundle` (portable .zip only); uploadPlainBinary
          # keeps the raw SoloMD-PE.exe as a build artifact so the step
          # has something to report, but it is never uploaded — the
          # "Build Windows portable .zip" step ships the only deliverable.
          uploadPlainBinary: ${{ matrix.platform == 'windows-latest' }}

      # ----------------------------------------------------------------------
      # PE packaging: Tauri derives bundle names from productName with native
      # arch labels (amd64/aarch64, plus a space in "SoloMD PE") while the
      # canonical PE scheme is SoloMD-PE_<version>_<arch>.<ext>
      # (arch: x64 | arm64, matching the published releases).
      # Package metadata (Conflicts/Replaces for .deb, Conflicts/Obsoletes
      # for .rpm) comes from bundle.linux in app/src-tauri/tauri.conf.json,
      # so this step renames locally and uploads canonical names only —
      # Tauri-native files never reach the release, so no delete step exists
      # (the old upload-then-delete flow left duplicates when GitHub
      # normalized spaces to dots and the delete missed — see pe.3).
      # ----------------------------------------------------------------------
      - name: Rename bundles to canonical names (Linux)
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./app/package.json').version")"
          TAG="${{ github.ref_name }}"
          shopt -s nullglob
          for f in app/src-tauri/target/release/bundle/deb/*.deb \
                   app/src-tauri/target/release/bundle/rpm/*.rpm; do
            base="$(basename "$f")"
            # Skip files this step already renamed (re-runs rebuild from
            # scratch on a fresh runner, but keep the guard — it makes the
            # step idempotent and documents the invariant).
            case "$base" in SoloMD-PE_*) continue ;; esac
            dir="$(dirname "$f")"
            arch="x64"
            case "$base" in
              *aarch64*|*arm64*) arch="arm64" ;;
            esac
            ext="${base##*.}"
            new="$dir/SoloMD-PE_${VERSION}_${arch}.${ext}"
            mv "$f" "$new"
            gh release upload "$TAG" "$new" --clobber
          done

      # ----------------------------------------------------------------------
      # PE DISABLED: Defender gate removed 2026-09-06 (no MSI in the matrix;
      # portable only). Restore from git history if the MSI job returns.
      # ----------------------------------------------------------------------

      # ----------------------------------------------------------------------
      # PE DISABLED: solomd-mcp standalone tarballs removed 2026-09-06
      # (Personal Edition ships the sidecar embedded only — no separate
      # download). Restore from git history if needed.
      # ----------------------------------------------------------------------

      # ----------------------------------------------------------------------
      # Windows portable .zip — PE: x64 only (windows-11-arm disabled).
      # Same SoloMD-PE.exe Tauri produces, zipped without an installer.
      # (PE: standalone solomd-mcp .zip disabled — sidecar stays embedded.)
      # ----------------------------------------------------------------------
      - name: Build Windows portable .zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PE: x64 only.
          $arch = "x64"
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $exe = "app/src-tauri/target/release/SoloMD-PE.exe"
          if (-Not (Test-Path $exe)) {
            Write-Error "Missing $exe — Tauri build did not run as expected"
            exit 1
          }
          # Locate the solomd-mcp.exe Tauri's externalBin built before the bundle.
          $mcpExe = Get-ChildItem -Path "mcp-server/target" -Recurse -Filter "solomd-mcp.exe" |
                    Where-Object { $_.FullName -match "\\release\\" } |
                    Select-Object -First 1
          $stage = "SoloMD-PE_${version}_${arch}-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe -Destination "$stage/SoloMD-PE.exe"
          if ($mcpExe) { Copy-Item $mcpExe.FullName -Destination "$stage/solomd-mcp.exe" }
          # Tiny README the user finds inside the zip.
          @"
          SoloMD PE ${version} — portable build (${arch})

          Just run SoloMD-PE.exe. No installation required.
          Settings + recents are stored in %APPDATA%\app.solomd-pe as usual.
          (Upstream settings migrate automatically on first launch.)

          Requires Microsoft Edge WebView2 (preinstalled on Windows 10/11).
          If launch fails with a WebView2 missing error, install from
          https://go.microsoft.com/fwlink/p/?LinkId=2124703
          "@ | Set-Content -Path "$stage/README.txt" -Encoding UTF8
          $zip = "SoloMD-PE_${version}_${arch}-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          gh release upload "${{ github.ref_name }}" $zip --clobber

      # ----------------------------------------------------------------------
      # PE DISABLED: install-mcp.sh self-test removed 2026-09-06 (no
      # standalone tarball). Restore from git history together with the
      # mcp tarball step if needed.
      # ----------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # PE DISABLED: web-clipper job removed 2026-09-06 (Personal Edition ships
  # no browser extension). Restore from git history and add it back to
  # `checksums.needs` if needed.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # SHA256SUMS.txt over every asset on the draft release.
  #
  # The Windows builds are unsigned, so Chrome and SmartScreen treat each new
  # version as an unknown binary with zero download reputation. A published
  # checksum manifest at least lets users verify what they downloaded until a
  # code-signing certificate is in place.
  #
  # Runs last so it covers the desktop matrix (Linux .deb/.rpm +
  # Windows portable). The macOS .dmg is uploaded by hand afterwards —
  # re-run `./scripts/checksums.sh <tag>` locally once it lands to refresh
  # the manifest.
  # ---------------------------------------------------------------------------
  checksums:
    needs: [publish] # PE: web-clipper disabled, so checksums waits on publish only
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Defense in depth for the single-upload flow: Tauri-native filenames
      # carry a space (productName "SoloMD PE") which GitHub normalizes to
      # dots, so any asset starting `SoloMD PE` / `SoloMD.PE` is a stray the
      # canonical `SoloMD-PE_*` scheme never produces — fail loudly instead
      # of publishing duplicates (pe.3 lesson).
      - name: Assert no native-named assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          strays="$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' | grep -E '^SoloMD[ .]PE' || true)"
          if [[ -n "$strays" ]]; then
            echo "::error::stray native-named assets on ${{ github.ref_name }}:"
            echo "$strays"
            exit 1
          fi
          echo "asset names clean"

      - name: Generate and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/checksums.sh "${{ github.ref_name }}"
