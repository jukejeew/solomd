name: Fork Linux CI (.deb ubuntu-24.04)

on:
  push:
    branches: [personal-main]
  workflow_dispatch:

concurrency:
  group: fork-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Install Linux deps (24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev xdg-utils file fuse libfuse2t64
      - name: Install frontend deps
        run: cd app && pnpm install --frozen-lockfile
      - name: Pre-build solomd-mcp sidecar
        run: |
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          bash scripts/build-mcp-sidecar.sh "$TRIPLE"
      - name: Build .deb
        run: cd app && pnpm tauri build --bundles deb
      - name: Read version
        id: ver
        run: echo "version=$(jq -r '.version' app/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - name: Show bundle
        run: find app/src-tauri/target/release/bundle -name '*.deb' | xargs ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: SoloMD_${{ steps.ver.outputs.version }}_amd64.deb
          path: app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
