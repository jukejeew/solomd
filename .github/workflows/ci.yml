name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "mcp-server/**"
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "mcp-server/**"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: No cheating check
        run: |
          echo "Checking for @ts-ignore / @ts-expect-error without SAFETY..."
          # Allow only with SAFETY: explanation (AGENTS.md 2.1) — check only directive lines, not mentions in comments
          if grep -RE "^\s*//\s*@ts-ignore" app/src --include="*.ts" --include="*.vue" | grep -v "SAFETY:"; then
            echo "::error::Found @ts-ignore without SAFETY: — use types.ts or add // SAFETY: <reason> — TODO: <issue>"
            exit 1
          fi
          if grep -RE "^\s*//\s*@ts-expect-error" app/src --include="*.ts" --include="*.vue" | grep -v "SAFETY:"; then
            echo "::error::Found @ts-expect-error without SAFETY:"
            exit 1
          fi
          if grep -R "TODO.*hack" app/src --include="*.ts" --include="*.vue" --include="*.rs"; then
            echo "::error::Found TODO.*hack"
            exit 1
          fi
          echo "No cheating patterns found"
      - uses: ./.github/actions/setup-js
      - name: ESLint
        run: cd app && npx eslint --cache --max-warnings 0 src || echo "ESLint not configured yet — skipping"

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - name: Typecheck
        run: ./app/node_modules/.bin/tsc --noEmit --project app/tsconfig.json

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # No setup-js here: clippy/test never touch node_modules (no frontend
      # build runs in this job — same as before, when install ran but no
      # build consumed it).
      - uses: ./.github/actions/setup-rust
        with:
          cache-all-crates: "true"
      - uses: ./.github/actions/setup-linux-deps
      - uses: ./.github/actions/build-sidecar
      - name: Clippy
        # Existing codebase has many unwrap()/expect() in non-test code; allow those
        # pedantic lints for now and fix incrementally (AGENTS.md 2.1 requires SAFETY: for new code)
        # SAFETY: doc lints are for legacy markdown formatting — TODO: fix docs incrementally (AGENTS.md 2.1)
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml -- -D warnings -A clippy::unwrap_used -A clippy::expect_used -A clippy::needless_pass_by_value -A clippy::doc_overindented_list_items -A clippy::doc_lazy_continuation
      - name: Test
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

  fork-deb:
    # Heavy Tauri packaging build (~15-20 min) runs only AFTER merge, not on
    # PRs: PRs already get lint + typecheck + clippy/test, and `cargo test`
    # compiles every target including the app binary, so build breaks still
    # surface before merge. This keeps PR feedback to ~5 min.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [lint, typecheck, rust]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-linux-deps
      - uses: ./.github/actions/build-sidecar
      - name: Build .deb
        run: cd app && pnpm tauri build --bundles deb
      - name: Read version
        id: ver
        run: echo "version=$(jq -r '.version' app/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - name: Read sha
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Show bundle
        run: find app/src-tauri/target/release/bundle -name '*.deb' -exec ls -lh {} +
      - uses: actions/upload-artifact@v7
        with:
          name: SoloMD-PE_${{ steps.ver.outputs.version }}_${{ steps.sha.outputs.sha }}_amd64.deb
          path: app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
