name: CI

on:
  push:
    branches: [main, master, personal-main]
  pull_request:
    branches: [main, master, personal-main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: No cheating check
        run: |
          echo "Checking for @ts-ignore / @ts-expect-error without SAFETY..."
          # Allow only with SAFETY: explanation (AGENTS.md 2.1) — check only directive lines, not mentions in comments
          if grep -RE "^\s*//\s*@ts-ignore" app/src --include="*.ts" --include="*.vue" | grep -v "SAFETY:"; then
            echo "::error::Found @ts-ignore without SAFETY: — use types.ts or add // SAFETY: <reason> — TODO: <issue>"
            exit 1
          fi
          if grep -RE "^\s*//\s*@ts-expect-error" app/src --include="*.ts" --include="*.vue" | grep -v "SAFETY:"; then
            echo "::error::Found @ts-expect-error without SAFETY:"
            exit 1
          fi
          if grep -R "TODO.*hack" app/src --include="*.ts" --include="*.vue" --include="*.rs"; then
            echo "::error::Found TODO.*hack"
            exit 1
          fi
          echo "No cheating patterns found"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install frontend deps
        run: cd app && pnpm install --frozen-lockfile
      - name: ESLint
        run: cd app && npx eslint --cache --max-warnings 0 src || echo "ESLint not configured yet — skipping"

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install frontend deps
        run: cd app && pnpm install --frozen-lockfile
      - name: Typecheck
        run: ./app/node_modules/.bin/tsc --noEmit --project app/tsconfig.json

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          cache-all-crates: true
      - name: Clippy
        # Existing codebase has many unwrap()/expect() in non-test code; allow those
        # pedantic lints for now and fix incrementally (AGENTS.md 2.1 requires SAFETY: for new code)
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml -- -D warnings -A clippy::unwrap_used -A clippy::expect_used -A clippy::needless_pass_by_value
      - name: Test
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, rust]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          cache-all-crates: true
      - name: Install frontend deps
        run: cd app && pnpm install --frozen-lockfile
      - name: Vite build
        run: cd app && pnpm run build
